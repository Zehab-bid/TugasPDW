<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portofolio — Halaman Utama</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F5F0E8;
      --ink: #1A1714;
      --rust: #C0522A;
      --gold: #D4A853;
      --sage: #6B7C5E;
      --blush: #E8D5C4;
      --paper: #FAF7F2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(245, 240, 232, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(26,23,20,0.08);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--rust);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--rust); }

    /* PAGE SYSTEM */
    .page { display: none; padding-top: 5rem; min-height: 100vh; }
    .page.active { display: block; }

    /* === HOME PAGE === */
    #home {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
      position: relative;
      overflow: hidden;
    }
    #home.active { display: flex; }

    .home-bg-shape {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .shape-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(192,82,42,0.08) 0%, transparent 70%);
      top: -150px; right: -150px;
    }
    .shape-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(212,168,83,0.1) 0%, transparent 70%);
      bottom: -100px; left: -100px;
    }

    .home-inner {
      text-align: center;
      z-index: 1;
      padding: 2rem;
      animation: fadeUp 0.9s ease both;
    }

    .home-eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1.5rem;
    }

    .home-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .home-title em {
      color: var(--rust);
      font-style: italic;
    }

    .home-subtitle {
      font-size: 1rem;
      color: var(--sage);
      margin: 1.5rem 0 2.5rem;
      font-weight: 300;
      max-width: 420px;
      line-height: 1.7;
      margin-left: auto;
      margin-right: auto;
    }

    .home-cta {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      background: var(--rust);
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
      border-radius: 2px;
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
      border: none;
    }
    .home-cta:hover { background: var(--ink); transform: translateY(-2px); }

    .home-scroll {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--sage);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .scroll-line {
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, var(--sage), transparent);
      animation: scrollPulse 2s ease infinite;
    }
/* === BIODATA PAGE === */
    #biodata {
      background: var(--paper);
    }
    .biodata-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 4rem;
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 2rem;
      animation: fadeUp 0.6s ease both;
    }

    .biodata-photo-card {
      position: sticky;
      top: 6rem;
      align-self: start;
      text-align: center;
    }

    .photo-frame {
      width: 200px;
      height: 240px;
      margin: 0 auto 1.5rem;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      background: var(--blush);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-frame::before {
      content: '';
      position: absolute;
      inset: -4px;
      border: 2px solid var(--gold);
      border-radius: 4px;
      z-index: -1;
      transform: rotate(2deg);
    }
    .photo-placeholder {
      font-size: 5rem;
      line-height: 1;
    }

    .photo-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
    }
    .photo-nim {
      font-size: 0.8rem;
      color: var(--sage);
      letter-spacing: 0.1em;
    }

    .biodata-info h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--ink);
    }
    .section-rule {
      width: 48px;
      height: 2px;
      background: var(--rust);
      margin-bottom: 2rem;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
    }
    .info-table tr {
      border-bottom: 1px solid rgba(26,23,20,0.07);
      transition: background 0.2s;
    }
    .info-table tr:hover { background: rgba(192,82,42,0.03); }
    .info-table td {
      padding: 0.9rem 0.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .info-table td:first-child {
      width: 40%;
      color: var(--sage);
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .media-section {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(26,23,20,0.1);
    }
    .media-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      font-style: italic;
    }

    
    
</script>
</body>
</html>
